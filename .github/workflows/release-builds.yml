name: Build & Release (Windows & Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Exe & Installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress --no-color
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller mk1300-win.spec --noconfirm --clean

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\mk1300-win-setup.iss

      - name: Verify build artifacts
        shell: bash
        run: |
          ls -lh dist/

      - name: Upload Windows Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'v1.0.0'
          files: |
            dist/mk1300-win.exe
            dist/mk1300-win-setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

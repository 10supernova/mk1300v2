name: Build & Release (Windows & Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Exe & Installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller mk1300-win.spec --noconfirm --clean

      - name: Build Inno Setup Installer
        run: |
          iscc windows/mk1300-win-setup.iss

      - name: Verify build artifacts
        shell: bash
        run: |
          ls -la dist/

      - name: Upload Windows Binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          files: |
            dist/mk1300-win.exe
            dist/mk1300-win-setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-arch:
    name: Build Arch Linux Package & Tarball
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools in Arch container
        run: |
          pacman -Syu --noconfirm base-devel git python python-gobject gtk4 libadwaita python-hidapi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare non-root user for makepkg
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build Arch package
        run: |
          su builder -c "makepkg -df --skipchecksums"

      - name: Create release tarball
        run: |
          tar -czf mk1300-linux-1.0.0.tar.gz --exclude='.git' --exclude='*.pkg.tar.*' --exclude='official_extracted' .

      - name: Upload Arch Assets to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          files: |
            *.pkg.tar.zst
            mk1300-linux-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
